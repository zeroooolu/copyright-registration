    CR202608270022:['山寺初有春水','欢唱网络科技（上海）有限公司','欢唱','待登记','pending_registration','batch','2026-08-27 18:04:34','5641043835879516'],

    CR202609030004:['溺空','姚晓雄','库音','失败','failed','batch','2026-09-03 17:18:17','—']

  const d=examples[id]||examples.CR202609030001;
  const $=x=>document.getElementById(x);

  document.querySelectorAll('.self-only').forEach(n=>n.hidden=!self);
  document.querySelectorAll('.legacy-only').forEach(n=>n.hidden=self);
  if(!self){document.querySelectorAll('.self-only').forEach(n=>n.style.display='none');document.querySelectorAll('.legacy-only').forEach(n=>n.style.display='');}
  else document.querySelectorAll('.legacy-only').forEach(n=>n.style.display='none');
  function renderCertificate(){
    const r=C.getReg(id),certificate=C.getDelivered(id),workId=C.workIdFor(id)||d[7];
    $('certificateWorkId').textContent=workId||'未取得';
    $('certificateRegNo').textContent=r?.number||'未获取';
    $('certificateSyncSource').textContent=r?.source==='mock_api'?'模拟官方接口返回（非真实查询）':r?.source==='manual'?'人工绑定':'未同步';
    $('certificateDelivery').textContent=certificate?'已发放 · '+certificate.deliveredAt:
      C.all().some(x=>x.appId===id&&x.delivery!=='delivered')?'待确认发放':'未上传';
    $('detailViewCert').hidden=!certificate;
    $('detailSyncReg').disabled=!C.workIdFor(id);
    $('certificateHint').textContent=certificate?'登记证书已交付，可通过用户前台查看和下载。':
      !C.workIdFor(id)?'当前申请尚无官方 WorkID，不能调用作品登记号接口。':
      '本页为交互原型：同步操作使用演示接口结果。真实接口需服务端携带 access_token 调用。';
    if(certificate){$('statusName').textContent='已发证'}
  }

    const result=C.sync([id]);C.rematchAll();renderCertificate();
    alert(result[0]?.code==='success'?'模拟同步成功：'+result[0].number:result[0]?.message||'同步失败');
  };
  $('detailViewCert').onclick=async()=>{
    const cert=C.getDelivered(id);if(!cert)return;
    const blob=await C.getBlob(cert.id);
    if(!blob)return alert('当前浏览器未找到 PNG 文件，请在原上传浏览器查看。');
    const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  };
  window.addEventListener('copyright-certificate-updated',renderCertificate);
  window.addEventListener('storage',renderCertificate);
  renderCertificate();

  opts.querySelectorAll('.supp-option').forEach(el=>{
    const k=el.dataset.material;
    if(k==='extra_authorization')el.querySelector('.supp-mode').value='append';
    el.querySelector('.supp-pick').onchange=()=>el.classList.toggle('checked',el.querySelector('.supp-pick').checked);
  });
  const close=()=>{$('suppOverlay').classList.remove('open');$('suppOverlay').setAttribute('aria-hidden','true')};
  function open(preselect){
    if(S.active(id))return alert('请先处理当前未完成的补充任务');
    opts.querySelectorAll('.supp-option').forEach(el=>{
      const m=S.MATERIALS.find(x=>x.key===el.dataset.material);
      const current=S.getAttachment(id,m.key,m.key==='audio'?d[0]+'.wav':m.file||'');
      el.querySelector('.supp-option-title small').textContent=current.entries.map(x=>x.name).join('、')||'未上传';
      const selected=preselect===el.dataset.material;
      el.querySelector('.supp-pick').checked=selected;el.classList.toggle('checked',selected);
      el.querySelector('.supp-requirement').value='';
    });
    document.querySelector('input[name="suppSource"][value="official"]').checked=true;
    $('suppDescription').value='';
    $('suppOverlay').classList.add('open');$('suppOverlay').setAttribute('aria-hidden','false');
  }
  $('requestBtn').onclick=()=>open();
  $('suppClose').onclick=close;$('suppCancel').onclick=close;
  $('suppOverlay').addEventListener('click',ev=>{if(ev.target===$('suppOverlay'))close()});
  document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
  flags.forEach(button=>button.onclick=()=>open(button.dataset.flag));
  $('suppCreate').onclick=()=>{
    const source=document.querySelector('input[name="suppSource"]:checked').value;
    const selected=[...opts.querySelectorAll('.supp-option.checked')];
    const description=$('suppDescription').value.trim();
    if(!description){$('suppDescription').focus();return alert('请先填写补证说明')}
    const items=selected.map(el=>{
      const key=el.dataset.material,m=S.MATERIALS.find(x=>x.key===key);
      const current=S.getAttachment(id,key,key==='audio'?d[0]+'.wav':m.file||'');
      return {key,original:current.entries.map(x=>x.name).join('、'),
        mode:current.entries.length?el.querySelector('.supp-mode').value:'append',
        reason:el.querySelector('.supp-reason').value,requirement:el.querySelector('.supp-requirement').value.trim()};
    });

    try{
      S.create({appNo:id,source,triggerStatus:d[4],workTitle:d[0],appSource:d[5],description,items});
      close();render();
    }catch(err){alert(err.message)}
  };
  const render=()=>{
    const records=S.list(id),active=S.active(id),root=$('suppRecords');
    $('requestBtn').disabled=!!active||d[4]==='issued'||d[4]==='failed';
    $('requestBtn').title=active?'需先完成当前补充任务':'';
    flags.forEach(btn=>{btn.disabled=$('requestBtn').disabled;btn.textContent=active&&active.items.some(x=>x.key===btn.dataset.flag)?'补充任务中':'标记需补充'});
    $('statusName').textContent=d[3];
    const statusDesc=document.querySelector('.status-panel .status-desc');
    statusDesc.textContent=active?'官方办理状态保持不变。当前材料补充任务：'+S.statusText(active.status)+'。':'当前申请材料按既有官方登记流程办理；历史材料补充任务可在左侧查看。';
    if(!records.length){root.innerHTML='<div class="supp-empty">暂无补充任务，可在上方发起材料补充，或点击附件旁的「标记需补充」。</div>';return}
    root.innerHTML=records.map(r=>{
      const badge=r.status==='completed'?'done':r.status==='needs_upload'?'warn':'';

      const meta='<div class="supp-request-line">发起人：'+e(r.operator)+' · 发起时间：'+e(r.createdAt)+'</div>';
      const explanation=e(r.description||r.officialNote||'');
      const items=r.items.map(i=>'<div class="supp-record-item"><div><strong>'+e(i.name)+'</strong><small>'+(i.mode==='replace'?'替换原文件':'补充新附件')+(i.reason&&i.reason!=='other'?' · '+e(S.TYPES.find(x=>x.value===i.reason)?.label||''):'')+'</small></div><div><p>'+e(i.requirement)+'</p><small>原文件：'+e(i.original||'未上传')+'　→　最新：'+e(i.replacement?.name||'待上传')+(i.approved?' · 已复核':'')+'</small>'+(i.versions.length>1?'<small>历史上传：'+i.versions.map(v=>e(v.name)+'（'+e(v.at)+'）').join('；')+'</small>':'')+(r.status==='reviewing'?'<label style="display:block;margin-top:7px"><input type="checkbox" data-reject="'+e(S.attachmentId(i))+'" data-rid="'+r.id+'"> 本附件仍需补充</label>':'')+'</div></div>').join('');
      let actions='';
      if(r.status==='reviewing')actions='<div class="supp-review"><div class="supp-review-row"><strong>材料复核</strong><span class="ra-sub">勾选仍不合格的附件可再次退回</span></div><textarea class="supp-review-input" id="reviewNote" placeholder="复核说明 / 再次补充要求（再次退回时必填）"></textarea><div class="supp-record-actions"><button type="button" class="ra-btn" data-act="reject">再次要求补充</button><button type="button" class="ra-btn primary" data-act="approve">确认材料通过</button></div></div>';
      if(r.status==='awaiting_official')actions='<div class="supp-review"><strong>补正材料：等待提交官方</strong><p class="supp-toolbar-note">用户上传只是提交到平台，材料复核通过后需运营确认已转交官方。</p><input class="supp-review-input" id="officialReceipt" placeholder="官方提交凭证编号 / 提交说明（必填）"><div class="supp-record-actions"><button type="button" class="ra-btn primary" data-act="send">确认已提交官方</button></div></div>';
      return '<div class="supp-record"><div class="supp-record-head"><div><strong>'+e(r.id)+' · '+(r.initiatedBy==='customer'?'用户主动补正':S.sourceText(r.source))+'</strong><small>'+(r.selectionMode==='self'?'用户自行选择附件':r.items.length+' 项指定附件')+'</small></div><span class="supp-badge '+badge+'">'+S.statusText(r.status)+'</span></div><div class="supp-record-body">'+meta+
      (explanation?'<div class="supp-description"><strong>'+(r.initiatedBy==='customer'?'用户补充说明':'补证说明')+'</strong><p>'+explanation+'</p></div>':'')+
      (!r.items.length?'<p class="supp-unassigned">未指定附件，等待用户按补证说明自行选择附件类型并上传。</p>':'')+items+actions+'<div class="supp-toolbar-note">流转记录：'+r.events.map(x=>e(x.at)+' '+e(x.label)).join(' · ')+'</div></div></div>';
    }).join('');
    root.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>{
      const action=btn.dataset.act;
      try{
        if(action==='send')S.markOfficial(id,$('officialReceipt').value);
        else if(action==='approve')S.review(id,'approve',[],$('reviewNote').value.trim());
        else{
          const rejected=[...root.querySelectorAll('[data-reject]:checked')].map(x=>x.dataset.reject);
          const reason=$('reviewNote').value.trim();
          if(!reason)return alert('请填写再次退回的具体补充说明');
          S.review(id,'reject',rejected,reason);
        }
        render();
      }catch(err){alert(err.message)}
    });
  };
  document.querySelectorAll('[data-preview]').forEach(el=>el.onclick=()=>alert('原型文件预览：'+el.textContent.trim()));
  render();
})();
</script>
<script src="../assets/js/attachment-manager.js"></script>
</body></html>
