<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>证书上传｜运营后台</title>
<link rel="stylesheet" href="../assets/css/admin-common.css">
<link rel="stylesheet" href="../assets/css/registration-admin.css">
<link rel="stylesheet" href="../assets/css/certificate.css">
</head>
<body data-admin-page="certificates" data-page-title="证书上传">
<div id="admin-shell"></div>
<template id="page-content">
<main class="cert-page">
  <header class="cert-header"><h1>证书上传</h1></header>
  <section class="cert-panel cert-upload-panel" aria-labelledby="certUploadTitle">
    <div class="cert-panel-head"><strong id="certUploadTitle">批量上传</strong><span class="cert-muted">PNG · 单张 ≤ 20 MB · 每批 ≤ 100 张</span></div>
    <div class="cert-panel-body">
      <div class="cert-drop" id="uploadDrop" tabindex="0" role="button" aria-label="拖拽或点击选择 PNG 证书">
        <span class="cert-drop-icon" aria-hidden="true">↑</span>
        <strong>拖拽证书到这里，或点击选择文件</strong>
        <span>支持同时上传多张 PNG</span>
      </div>
      <input id="certFiles" type="file" accept=".png,image/png" multiple hidden>
      <div class="cert-upload-actions"><button type="button" class="cert-btn primary" id="chooseFiles">选择文件</button></div>
      <div id="uploadProgress" class="cert-progress" role="status" aria-live="polite" hidden></div>
    </div>
  </section>
  <section class="cert-panel cert-list-panel" aria-labelledby="certListTitle">
    <div class="cert-panel-head">
      <div class="cert-list-title"><strong id="certListTitle">上传记录</strong><span id="resultCount" class="cert-muted">0 条</span></div>
      <button type="button" class="cert-btn primary" id="bulkDeliver" disabled>批量发放（0）</button>
    </div>
    <div class="cert-toolbar">
      <input type="search" id="certSearch" aria-label="搜索上传记录" placeholder="搜索文件名、登记号或申请编号">
      <select id="certFilter" aria-label="按处理状态筛选">
        <option value="all">全部状态</option>
        <option value="pending">待处理</option>
        <option value="matched">待发放</option>
        <option value="delivered">已发放</option>
      </select>
    </div>
    <div class="cert-table-scroll">
      <table class="cert-table">
        <colgroup><col style="width:5%"><col style="width:28%"><col style="width:23%"><col style="width:22%"><col style="width:13%"><col style="width:9%"></colgroup>
        <thead><tr><th><input id="certSelectAll" type="checkbox" aria-label="全选当前可发放的证书"></th><th>证书文件</th><th>作品登记号</th><th>关联申请</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="certificateRows"><tr><td colspan="6" class="cert-empty">暂无上传记录</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
</template>
<div id="certOverlay" class="cert-overlay" aria-hidden="true">
  <div class="cert-drawer" role="dialog" aria-modal="true" aria-labelledby="certDrawerTitle">
    <div class="cert-drawer-head"><div><h2 id="certDrawerTitle">核对证书</h2><small id="certDrawerSubtitle"></small></div>
      <button type="button" class="cert-btn" id="certClose">关闭</button></div>
    <div class="cert-drawer-body">
      <div id="certPreview" class="cert-preview"><span class="cert-placeholder">加载预览中…</span></div>
      <div class="cert-form-group"><label for="certReg">作品登记号</label>
        <input class="cert-input" id="certReg" placeholder="输入或核对证书上的登记号">
      </div>
      <div class="cert-form-group">
        <label for="certAppSearch">关联登记申请</label>
        <input id="certAppSearch" class="cert-input" type="search" autocomplete="off"
          placeholder="搜索申请编号、作品名称或著作权人">
        <div id="certAppResults" class="cert-app-results" aria-live="polite"></div>
        <div id="certSelectedApp" class="cert-app-picked" hidden></div>
      </div>
      <div class="cert-match-info" id="certMatchInfo"></div>
      <div id="certOCRResult" class="cert-inline-status" role="status" aria-live="polite"></div>
      <div class="cert-inline">
        <button type="button" class="cert-small-btn" id="certOCR">重新识别登记号</button>
        <button type="button" class="cert-small-btn" id="certOpenImage">查看原图</button>
      </div>
    </div>
    <div class="cert-drawer-actions">
      <button type="button" class="cert-btn danger" id="certDelete">删除</button>
      <span class="cert-spacer"></span>
      <button type="button" class="cert-btn" id="certSave">保存并匹配</button>
      <button type="button" class="cert-btn primary" id="certDeliver">确认发放</button>
    </div>
  </div>
</div>
<script src="../assets/js/admin-shell.js"></script>
<script src="../../certificate-store.js"></script>
<script src="../assets/js/certificate-page.js"></script>
</body></html>
