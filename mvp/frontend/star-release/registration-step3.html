<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>正在前往统一收银台｜著作权登记</title>
<script>
(()=>{
  const p=new URLSearchParams(location.search);
  const q=new URLSearchParams({
    source:'copyright',
    title:p.get('title')||'晴天',
    artist:p.get('artist')||'周杰伦',
    album:p.get('album')||'叶惠美',
    cover:p.get('cover')||(p.get('title')||'晴天').slice(0,1),
    registration_name:p.get('registration_name')||p.get('title')||'晴天',
    order_total:'39.0'
  });
  const submissionNo=p.get('submission_no');
  if(submissionNo)q.set('submission_no',submissionNo);
  location.replace('../payment-center-checkout.html?'+q.toString());
})();
</script>
</head>
<body></body>
</html>
