</div></main><script src="star-release-shell.js"></script><script src="../../supplement-store.js"></script><script>
(()=>{
const p=new URLSearchParams(location.search),status=p.get('status')||'pending_accept',title=p.get('title')||'青花瓷',artist=p.get('artist')||'周杰伦',album=p.get('album')||'我很忙',cover=p.get('cover')||title.slice(0,1),registrationName=p.get('registration_name')||title,appNo=p.get('app_no')||'CR202608260001',submissionNo=p.get('submission_no')||'CRSUB202608260001',orderNo=p.get('order_no')||'CRPAY202608260001',orderTotal=39,paid=Number(p.get('paid_amount')||orderTotal);
const money=n=>'¥'+Number(n).toFixed(2);
document.getElementById('title').textContent=registrationName;document.getElementById('meta').textContent='作品名称：'+title+' · '+artist+' · '+album;document.getElementById('cover').textContent=cover;document.getElementById('typeChip').textContent='录音制品';document.getElementById('workName').textContent=title;document.getElementById('registrationName').textContent=registrationName;document.getElementById('registrationType').textContent='录音制品';document.getElementById('appNo').textContent=appNo;document.getElementById('appNoHead').textContent='申请编号：'+appNo;document.getElementById('submissionNo').textContent=submissionNo;document.getElementById('orderNoHead').textContent='支付订单：'+orderNo;document.getElementById('orderTotal').textContent=money(orderTotal);document.getElementById('paid').textContent=money(paid);
document.getElementById('materials').innerHTML='<div class="kv"><span>授权委托协议</span><strong class="link">查看已签协议</strong></div><div class="kv"><span>作品音频</span><strong class="link">'+title+'.wav</strong></div><div class="kv"><span>主体证明</span><strong class="link">营业执照.jpg</strong></div><div class="kv"><span>作品信息</span><strong>已提交</strong></div>';
const configs={pending_accept:{name:'待受理',desc:'申请已提交，正在等待登记机构受理。',tone:'normal',official:0,side:'材料已经提交，等待登记机构正式受理。'},pending_supplement:{name:'待补证',desc:'登记机构要求补充或修正当前申请材料。',tone:'warning',official:1,supplement:true,side:'登记机构要求补充材料，请在下方查看本次补正要求并在线上传。'},pending_registration:{name:'待登记',desc:'申请已受理，正在进入登记办理。',tone:'normal',official:2,accepted:true,side:'当前申请已受理，正在进行登记处理。'},pending_first_review:{name:'待初审',desc:'当前申请材料正在进行初审。',tone:'normal',official:3,accepted:true,side:'当前申请正在初审，无需你额外操作。'},pending_re_review:{name:'待复审',desc:'初审已完成，当前申请正在进行复审。',tone:'normal',official:4,accepted:true,side:'当前申请已进入复审阶段，无需你额外操作。'},pending_certificate:{name:'待制证',desc:'当前申请审核已通过，正在制作登记证书。',tone:'normal',official:5,accepted:true,side:'当前申请审核已完成，正在生成登记证书。'},issued:{name:'已发证',desc:'当前登记申请已完成，证书已签发。',tone:'success',official:6,accepted:true,issued:true,side:'登记已完成，请联系 content@kanjian.com 获取证书'}};
const stages=['已提交','已受理','审核登记','制证','完成'],official=['待受理','待补证','待登记','待初审','待复审','待制证','已发证'];
function stageIndex(c){if(c.name==='待受理')return 0;if(c.name==='待登记')return 1;if(['待补证','待初审','待复审'].includes(c.name))return 2;if(c.name==='待制证')return 3;return 4}
function statusName(key){return (configs[key]||configs.pending_accept).name}
function render(key){const c=configs[key]||configs.pending_accept,actionBody=document.getElementById('actionBody');document.getElementById('statusSelect').value=key;document.getElementById('statusName').textContent=c.name;document.getElementById('statusDesc').textContent=c.desc;document.getElementById('sideStatus').textContent=c.name;document.getElementById('sideDesc').textContent=c.side;document.getElementById('statusLine').className='status-line status-'+c.tone;actionBody.classList.add('no-primary');document.getElementById('acceptedAt').textContent=c.accepted?'2026-08-27 10:18':'—';const notice=document.getElementById('notice'),noticeText=document.getElementById('noticeText');notice.className='notice';if(c.supplement){notice.classList.add('warning');noticeText.innerHTML='<strong>当前申请需要补证：</strong>如已收到补正清单，可在本页按要求上传指定附件；如未看到清单，请联系 content@kanjian.com。';}else if(c.issued){notice.classList.add('success');noticeText.innerHTML='<strong>当前申请登记已完成：</strong>请联系 content@kanjian.com 获取证书。';}else{noticeText.innerHTML='<strong>办理时限说明：</strong>自受理申请材料之日起 30 个工作日内完成作品版权登记事项，申请人补正材料所需时间不计算在内。';}const idx=stageIndex(c);document.getElementById('progress').innerHTML=stages.map((x,i)=>'<div class="step '+(idx>i?'done':idx===i?'active':'')+'">'+x+'</div>').join('');document.getElementById('officialFlow').innerHTML=official.map((x,i)=>{let cls='flow-item';if(i<c.official)cls+=' done';if(i===c.official)cls+=' current';if(c.supplement&&i===1)cls+=' branch';const detail=x==='待补证'?'仅在当前申请材料需要补充或修正时进入此节点。':'';return '<div class="'+cls+'"><span class="flow-node">'+(i<c.official?'✓':i+1)+'</span><div class="flow-name">'+x+'</div><div class="flow-time">'+(i<c.official?'已完成':' ')+'</div>'+(detail?'<div class="flow-detail">'+detail+'</div>':'')+'</div>'}).join('');const dt=document.getElementById('deadlineTitle'),dd=document.getElementById('deadlineText');if(c.name==='待受理'){dt.textContent='受理后 30 个工作日内完成';dd.textContent='当前申请尚未正式受理，办理时限将在受理后开始计算。';}else if(c.supplement){dt.textContent='当前申请办理时限暂停计算';dd.textContent='等待当前申请补正材料，补正时间不计算在 30 个工作日内。';}else if(c.issued){dt.textContent='当前申请登记已完成';dd.textContent='证书已经签发，不再显示预计办理时限。';}else{dt.textContent='受理后 30 个工作日内完成';dd.textContent='当前申请已于 2026-08-27 受理，正在官方办理流程中。';}const events=[['付款并提交','2026-08-26 14:38','本次提交完成，生成独立申请 '+appNo]];if(c.accepted)events.unshift(['申请已受理','2026-08-27 10:18','当前申请官方办理时限开始计算']);if(c.supplement)events.unshift(['需要补充材料','2026-08-29 11:30','当前申请需要补充主体证明材料']);if(c.official>=3)events.unshift(['进入初审','2026-09-03 09:42','当前申请材料进入初审']);if(c.official>=4)events.unshift(['进入复审','2026-09-08 16:10','当前申请初审完成，进入复审']);if(c.official>=5)events.unshift(['审核通过','2026-09-12 15:20','当前申请进入证书制作']);if(c.issued)events.unshift(['登记证书已签发','2026-09-18 10:06','登记已完成，请联系 content@kanjian.com 获取证书']);document.getElementById('eventTimeline').innerHTML=events.map((e,i)=>'<div class="event '+(i===0?'current':'')+'"><strong>'+e[0]+'</strong><span>'+e[1]+'</span><p>'+e[2]+'</p></div>').join('')}

const S=window.CopyrightSupplement;
const esc=S.escapeHTML;
const supplementPanel=document.getElementById('supplementPanel');
function showSupplement(){
  const req=S.active(appNo),last=S.latest(appNo);
  if(!req){render(new URLSearchParams(location.search).get('status')||status);}
  if(!req&&!last){supplementPanel.hidden=true;document.getElementById('statusSelect').disabled=false;return}
  supplementPanel.hidden=false;
  document.getElementById('statusSelect').disabled=!!req;
  const record=req||last;
  const source=S.sourceText(record.source),deadline=record.deadline?' · 截止日期：'+esc(record.deadline):'';
  const need=req?.status==='needs_upload',reviewing=req?.status==='reviewing',pendingOfficial=req?.status==='awaiting_official';
  const stateLabel=need?'待补充材料':reviewing?'材料审核中':pendingOfficial?'待提交官方':'补充材料已完成';
  if(req){
    document.getElementById('statusName').textContent=stateLabel;
    document.getElementById('sideStatus').textContent=stateLabel;
    const explain=need?'请仅上传本次指定的材料，其余登记资料无需修改。':reviewing?'补充材料已提交至看见音乐平台，等待复核。':'材料已通过平台复核，等待工作人员提交官方。';
    document.getElementById('statusDesc').textContent=explain;
    document.getElementById('sideDesc').textContent=explain;
    document.getElementById('statusLine').className='status-line '+(need?'status-warning':'status-normal');
    const notice=document.getElementById('notice');
    notice.className='notice'+(need?' warning':'');
    document.getElementById('noticeText').textContent=source+'：'+explain;
    document.getElementById('deadlineTitle').textContent=record.deadline?'补充截止时间：'+record.deadline:'补充材料处理中';
    document.getElementById('deadlineText').textContent=record.source==='official'?'用户上传后仍需平台复核和确认转交官方；在线提交不等于已提交登记机构。':'材料经平台复核后恢复原办理阶段。';
  }
  const intro='<div class="supp-front-head"><div><strong>'+stateLabel+'</strong><p>'+source+' · '+record.items.length+' 项附件需要处理'+deadline+'</p></div><span class="supp-front-tag">'+esc(S.statusText(record.status))+'</span></div>';
  const note=record.officialNote?'<div class="supp-front-note">'+esc(record.officialNote)+'</div>':'';
  const official=record.officialFile?'<div class="supp-front-note">官方补正通知：'+esc(record.officialFile.name)+'（原型仅记录文件名）</div>':'';
  const items=record.items.map(item=>{
    const open=need&&!item.approved,approved=item.approved,finalName=item.replacement?.name;
    let upload='';
    if(open){
      const accept=S.MATERIALS.find(m=>m.key===item.key)?.accept||'';
      upload='<div class="supp-front-upload"><label for="suppInput-'+item.key+'">'+(item.mode==='replace'?'重新选择文件':'补充上传文件')+' *</label><input id="suppInput-'+item.key+'" data-supp-file="'+item.key+'" type="file" accept="'+esc(accept)+'"><small data-file-name="'+item.key+'">选择后将显示文件名称，确认无误再提交。</small></div>';
    }
    const badge=approved?'<span class="supp-front-item-badge done">本轮已通过</span>':'<span class="supp-front-item-badge">'+(open?'待上传':reviewing?'待复核':'已上传')+'</span>';
    return '<div class="supp-front-item"><div class="supp-front-item-head"><strong>'+esc(item.name)+'</strong>'+badge+'</div><p>'+esc(item.requirement)+'</p><div class="supp-front-fileline">处理方式：'+(item.mode==='replace'?'替换原文件':'补充新附件')+' · 原文件：'+esc(item.original||'未上传')+'</div>'+(finalName?'<div class="supp-front-fileline">最新提交：'+esc(finalName)+(item.versions.length>1?' · 共提交 '+item.versions.length+' 次':'')+'</div>':'')+upload+'</div>';
  }).join('');
  const footer=need?'<div class="supp-front-actions"><p id="suppFrontHint">请完成全部必补项后提交。</p><button type="button" id="suppFrontSubmit" class="supp-front-submit" disabled>提交补充材料</button></div>':reviewing?'<div class="supp-front-note">已提交至看见音乐平台，工作人员复核后会更新状态。无需重复上传。</div>':pendingOfficial?'<div class="supp-front-note">材料已通过复核，工作人员将继续办理官方补正。用户无需操作。</div>':'<div class="supp-front-note">本次补充流程已完成，原登记申请继续办理。</div>';
  const events='<div class="supp-front-activity">处理记录：'+record.events.map(evt=>esc(evt.at)+' · '+esc(evt.label)).join('　 /　 ')+'</div>';
  supplementPanel.innerHTML=intro+'<div class="supp-front-body">'+note+official+items+footer+events+'<div class="supp-front-activity">原型说明：上传操作仅记录文件名称和版本，不会把实际文件传到服务端。</div></div>';
  if(!need)return;
  const inputs=[...supplementPanel.querySelectorAll('[data-supp-file]')];
  const hint=document.getElementById('suppFrontHint'),button=document.getElementById('suppFrontSubmit');
  const valid=()=>{
    const chosen=inputs.filter(inp=>inp.files?.length).length;
    const sizesOK=inputs.every(inp=>!inp.files?.length||inp.files[0].size<=20*1024*1024);
    button.disabled=chosen!==inputs.length||!sizesOK;
    hint.textContent=!sizesOK?'单个附件大小不能超过 20 MB':'已选择 '+chosen+'/'+inputs.length+' 项必补附件';
  };
  inputs.forEach(inp=>inp.addEventListener('change',()=>{
    const file=inp.files?.[0],display=supplementPanel.querySelector('[data-file-name="'+inp.dataset.suppFile+'"]');
    if(display)display.textContent=file?'已选择：'+file.name+'（'+(file.size/1024/1024).toFixed(2)+' MB）':'请上传文件';
    valid();
  }));
  button.onclick=()=>{
    const files={};inputs.forEach(inp=>{files[inp.dataset.suppFile]=inp.files?.[0]});
    try{S.submit(appNo,files);showSupplement();window.scrollTo({top:0,behavior:'smooth'})}
    catch(err){alert(err.message)}
  };
}

document.getElementById('statusSelect').addEventListener('change',event=>{const q=new URLSearchParams(location.search);q.set('status',event.target.value);history.replaceState(null,'','?'+q.toString());render(event.target.value);showSupplement()});document.getElementById('secondaryBtn').onclick=()=>location.href='index.html';render(S.active(appNo)?.triggerStatus||status);showSupplement();window.addEventListener('storage',showSupplement);window.addEventListener('copyright-supplement-updated',showSupplement);
})();
</script></body></html>
