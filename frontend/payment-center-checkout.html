<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>统一收银台｜星球发行</title><link rel="stylesheet" href="star-release/star-release-shell.css"><style>
:root{--brand:#2448ff;--brand-hover:#1839e8;--page:#f4f6f9;--ink:#20232a;--muted:#747c87;--line:#e4e7ec;--field:#f8f9fb;--success:#168653;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-width:1120px;background:var(--page);color:var(--ink);font-size:14px}button,input{font:inherit}button{cursor:pointer}.host{padding:0 22px 40px}.head{height:72px;display:flex;align-items:center;justify-content:space-between}.head h1{margin:0;font-size:20px}.head p{margin:5px 0 0;color:#858d98;font-size:11px}.back{border:0;background:transparent;color:var(--brand);font-size:12px}.page{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(520px,1.1fr);background:#fff;border:1px solid #d9dde5;border-radius:6px;overflow:hidden;min-height:650px}.summary{padding:42px;background:#fafafa;border-right:1px solid var(--line)}.checkout{padding:42px 48px}.summary-title{font-weight:600;margin-bottom:24px}.order{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.cover{width:52px;height:52px;border-radius:5px;display:grid;place-items:center;background:linear-gradient(135deg,#6476ea,#9b78d5);color:#fff;font-weight:600}.order strong{font-size:13px}.order span{display:block;margin-top:4px;color:#8b929c;font-size:11px}.row{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid var(--line);font-size:12px}.row span{color:#747c87}.row.discount strong{color:var(--success)}.total{display:flex;justify-content:space-between;padding-top:20px}.total strong{font-size:22px}.split-hint{margin-top:18px;padding:11px 12px;border:1px solid #e0e5f8;border-radius:4px;background:#f8f9ff;color:#707a91;font-size:10px;line-height:1.65}.checkout h2{margin:0 0 20px;font-size:22px}.methods{border:1px solid var(--line);border-radius:7px;overflow:hidden}.method{border-bottom:1px solid var(--line)}.method:last-child{border-bottom:0}.method-head{width:100%;min-height:62px;display:grid;grid-template-columns:20px 40px 1fr auto;gap:11px;align-items:center;padding:13px 15px;border:0;background:#fff;text-align:left}.radio{width:17px;height:17px;border:2px solid #a0a7b1;border-radius:50%;position:relative}.method.active .radio{border-color:var(--brand)}.method.active .radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}.logo{width:40px;height:28px;border-radius:4px;background:#f1f3f6;display:grid;place-items:center;font-size:9px;font-weight:700}.method-name{font-size:13px;font-weight:600}.method-side{color:#858d98;font-size:10px}.method-body{display:none;padding:0 15px 18px 55px}.method.active .method-body{display:block}.field{margin-top:12px}.field label{display:block;margin-bottom:7px;font-size:12px}.input{width:100%;height:42px;border:1px solid #dfe3e8;border-radius:5px;background:var(--field);padding:0 12px;outline:0}.card-box{border:1px solid #dfe3e8;border-radius:5px;background:var(--field);overflow:hidden}.card-box input{width:100%;height:42px;border:0;background:transparent;padding:0 12px;outline:0}.card-box .split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e3e6eb}.card-box .split input+input{border-left:1px solid #e3e6eb}.redirect{padding:13px;background:#f7f8fa;border-radius:5px;color:#646c77;font-size:11px;line-height:1.6}.pay{width:100%;height:43px;margin-top:18px;border:1px solid var(--brand);border-radius:5px;background:var(--brand);color:#fff;font-weight:600}.trust{margin-top:16px;color:#969da7;font-size:10px;line-height:1.6}@media(max-width:1240px){.page{grid-template-columns:1fr}.summary{border-right:0;border-bottom:1px solid var(--line)}.summary,.checkout{padding:32px}}
</style></head><body><aside class="sidebar"></aside><header class="topbar"></header><main class="workspace"><div class="host"><div class="head"><div><h1>统一收银台</h1><p>请选择支付方式完成著作权登记服务费支付。</p></div><button class="back" onclick="history.back()">返回付款确认</button></div><div class="page"><section class="summary"><div class="summary-title">订单摘要</div><div class="order"><div class="cover" id="cover">晴</div><div><strong id="title">晴天</strong><span id="types">登记录音的著作权</span></div><strong id="orderTotal"></strong></div><div class="row discount" id="deductRow"><span>可提现余额抵扣</span><strong id="deduct"></strong></div><div class="row"><span>剩余应付</span><strong id="payableRow"></strong></div><div class="total"><span>本次支付</span><strong id="payable"></strong></div><div class="split-hint" id="splitHint"></div></section><section class="checkout"><h2>选择支付方式</h2><div class="methods"><section class="method active" data-method="银行卡"><button class="method-head"><span class="radio"></span><span class="logo">CARD</span><span class="method-name">银行卡</span><span class="method-side">Visa · Mastercard · UnionPay</span></button><div class="method-body"><div class="field"><label>邮箱</label><input class="input" type="email" value="copyright@example.com"></div><div class="field"><label>银行卡信息</label><div class="card-box"><input placeholder="1234 1234 1234 1234"><div class="split"><input placeholder="MM / YY"><input placeholder="CVC"></div></div></div><div class="field"><label>持卡人姓名</label><input class="input" value="张三"></div><button class="pay">支付 <span data-amount></span></button></div></section><section class="method" data-method="Airwallex Pay"><button class="method-head"><span class="radio"></span><span class="logo" style="color:#ff6138">AWX</span><span class="method-name">Airwallex Pay</span><span></span></button><div class="method-body"><div class="redirect">确认后将跳转至 Airwallex 完成付款。</div><button class="pay">继续支付 <span data-amount></span></button></div></section><section class="method" data-method="PayPal"><button class="method-head"><span class="radio"></span><span class="logo" style="color:#1674d1">PP</span><span class="method-name">PayPal</span><span></span></button><div class="method-body"><div class="redirect">确认后将跳转至 PayPal 完成付款。</div><button class="pay">继续支付 <span data-amount></span></button></div></section></div><div class="trust">支付信息由统一收银台处理。支付成功后，系统会按所选登记项目分别生成独立申请并提交办理。</div></section></div></div></main><script src="star-release/star-release-shell.js"></script><script>
(()=>{const p=new URLSearchParams(location.search),title=p.get('title')||'晴天',artist=p.get('artist')||'周杰伦',album=p.get('album')||'叶惠美',cover=p.get('cover')||title.slice(0,1),types=(p.get('types')||'recording').split(',').filter(Boolean),total=Number(p.get('order_total')||9.9),deduct=Number(p.get('balance_deduct')||0),payable=Number(p.get('payable')||Math.max(0,total-deduct)),money=n=>'¥'+Number(n).toFixed(2),label=t=>t==='composition'?'登记词曲的著作权':'登记录音的著作权';document.getElementById('title').textContent=title;document.getElementById('cover').textContent=cover;document.getElementById('types').textContent=types.map(label).join('、');document.getElementById('orderTotal').textContent=money(total);document.getElementById('deduct').textContent='- '+money(deduct);document.getElementById('deductRow').style.display=deduct>0?'flex':'none';document.getElementById('payableRow').textContent=money(payable);document.getElementById('payable').textContent=money(payable);document.getElementById('splitHint').textContent=types.length>1?'支付成功后将生成 '+types.length+' 条独立登记申请，并分别进入办理流程。':'支付成功后将生成 1 条登记申请。';document.querySelectorAll('[data-amount]').forEach(x=>x.textContent=money(payable));let method='银行卡';document.querySelectorAll('.method').forEach(m=>m.querySelector('.method-head').onclick=()=>{document.querySelectorAll('.method').forEach(x=>x.classList.remove('active'));m.classList.add('active');method=m.dataset.method});document.querySelectorAll('.pay').forEach(btn=>btn.onclick=()=>{const q=new URLSearchParams({source:'copyright',title,artist,album,cover,types:types.join(','),order_total:total.toFixed(1),balance_deduct:deduct.toFixed(1),paid_amount:payable.toFixed(1),method,order_no:'CRPAY202608260001',submission_no:'CRSUB202608260001'});location.href='payment-success.html?'+q.toString()});})();
</script></body></html>
